name: Work 8 O33 actual application capture and replay
on:
  push:
    branches: ['work8/writer-integration-20261025v']
permissions:
  contents: read
concurrency:
  group: work8-writer-integration-20261025v
  cancel-in-progress: false
jobs:
  writer-integration:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout approved event source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Node runtime from reviewed repository pin
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
      - name: Compile changed backend boundary with its Pillow dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work8-o33-evidence"
          {
            npm ci --prefix pillow
            npm ci --prefix backend
            node scripts/sync-pillow-governance.mjs
            npm run build --prefix pillow
            npm run build --prefix backend
          } 2>&1 | tee "$RUNNER_TEMP/work8-o33-evidence/build.log"
      # Watchdog preflight and Owner Console builds accepted in run40424964819; no duplicate jobs.
      - name: Examine complete declared O33 topology capture and replay
        env:
          WORK8_EXPECTED_SOURCE: ${{ github.sha }}
        run: bash scripts/work8/run-o33-application.sh
      - name: Retain exact-source evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work8-o33-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/work8-o33-evidence/
          if-no-files-found: error
          retention-days: 7
