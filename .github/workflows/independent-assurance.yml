name: Independent Assurance Core
on:
  pull_request:
    paths:
      - 'backend/src/assurance/**'
      - 'deployment/locked-runtime.cjs'
      - 'deployment/assurance-supervisor.cjs'
      - 'backend/src/runtime/tier0-isolated-primary.ts'
      - 'backend/src/validation/tests/*assurance*.test.mjs'
      - '.github/workflows/independent-assurance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: |
          node backend/src/validation/tests/assurance-owner-evidence.test.mjs
          node backend/src/validation/tests/independent-assurance.test.mjs
          node backend/src/validation/tests/assurance-runtime-collector.test.mjs
          node backend/src/validation/tests/assurance-live-sources.test.mjs
          node backend/src/validation/tests/assurance-internal-collectors.test.mjs
          node backend/src/validation/tests/assurance-supervisor.test.mjs
          node backend/src/validation/tests/assurance-discrepancy-probe.test.mjs
          node backend/src/validation/tests/omission-collector.test.mjs
