name: Assurance owner browser contract
on:
  pull_request:
    paths:
      - 'empireai-web/**'
      - '.github/workflows/assurance-owner-browser.yml'
permissions:
  contents: read
jobs:
  owner-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
      - name: Install locked frontend and supported Chromium runtime
        working-directory: empireai-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build owner interface
        working-directory: empireai-web
        run: npm run build
      - name: Verify mobile and desktop contracts on loopback fixtures
        env:
          WORK7_SCREENSHOTS: ${{ runner.temp }}/work7-owner-screenshots
        working-directory: empireai-web
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3123 > "$RUNNER_TEMP/assurance-ui-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3123/login > /dev/null; then break; fi
            sleep 1
          done
          node --test e2e/assurance-owner.test.mjs e2e/finance-owner.test.mjs e2e/governed-commerce-owner.test.mjs e2e/work7-owner.test.mjs e2e/work7-chat-owner.test.mjs e2e/work7-toolbar.test.mjs e2e/work7-cost-categories.test.mjs e2e/work7-legacy-denial.test.mjs e2e/work7-workspace.test.mjs
      - name: Preserve browser server diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assurance-owner-browser-server
          path: ${{ runner.temp }}/assurance-ui-server.log

      - name: Preserve Work 7 rendered fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work7-owner-rendered-fixtures
          path: ${{ runner.temp }}/work7-owner-screenshots


  work8-source-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work8/autonomous-examination-20261011
          path: a8-backend
          persist-credentials: false
      - name: Verify reviewed backend tree
        run: test "$(git -C a8-backend rev-parse HEAD^{tree})" = 'e668d9b61851b70b5ef3cc97f816520cde6105fc'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked backend dependencies
        working-directory: a8-backend/backend
        run: npm ci
      - name: Install locked browser dependencies
        working-directory: empireai-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify source binding and Pillow compaction boundary
        working-directory: a8-backend/backend
        run: |
          mkdir -p "${{ runner.temp }}/work8-source-context"
          node --import tsx --test src/validation/tests/work8-source-product-context.test.ts > "${{ runner.temp }}/work8-source-context/source-product-context.tap" 2>&1
      - name: Verify product context client boundary
        working-directory: empireai-web
        run: node --import tsx --test lib/pillow/product-context.test.ts > "${{ runner.temp }}/work8-source-context/product-context-client.tap" 2>&1
      - name: Build exact owner interface
        working-directory: empireai-web
        run: npm run build
      - name: Verify genuine source context in actual connected browser
        working-directory: empireai-web
        env:
          WORK8_A8_BACKEND_ROOT: ${{ github.workspace }}/a8-backend/backend
          WORK8_A8_OUT: ${{ runner.temp }}/work8-source-context
        run: node e2e/work8-source-context-native.mjs
      - name: Preserve context examination evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work8-source-context
          path: ${{ runner.temp }}/work8-source-context
          if-no-files-found: error
