name: Product path CI

# This workflow verifies repository product code with bounded offline tests only. It does not deploy, promote,
# certify Birth/Wave status or unlock commerce. The deployed Vercel project uses
# empireai-web as its Root Directory; the root Vite config remains compatibility residue.
on:
  pull_request:
  push:
    branches:
      - main
      - 'ci/product-path-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-path-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  SOAK_ALLOW_LIVE_RUN: '0'

jobs:
  repository-contract:
    name: Repository and deployment-root contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event revision without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
      - name: Verify package scripts, lockfiles and the production web contract
        run: node scripts/verify-product-path-ci.mjs
      - name: Verify deterministic build configuration and reject runtime drift
        run: node --test scripts/verify-build-runtime.test.mjs
      - name: Verify isolated provider read-only observation without credentials
        run: node --test deployment/provider-readback.test.mjs deployment/cj-supplier-readback.test.mjs deployment/cj-stock-discovery.test.mjs
      - name: Rehearse combined disk capture and fresh-process restore without production access
        run: node deployment/rehearse-cutover-recovery.cjs > "$RUNNER_TEMP/cutover-rehearsal.json"
      - name: Preserve restore rehearsal receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cutover-rehearsal
          path: ${{ runner.temp }}/cutover-rehearsal.json
          retention-days: 14
      - name: Verify disk-only legacy checkpoint capture and refusal cases
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap deployment/legacy-checkpoint-capture.test.cjs | tee "$RUNNER_TEMP/legacy-checkpoint-tests.tap"
          node - "$RUNNER_TEMP/legacy-checkpoint-tests.tap" <<'NODE'
          const assert = require('node:assert/strict');
          const output = require('node:fs').readFileSync(process.argv[2], 'utf8');
          const count = name => {
            const match = output.match(new RegExp(`^# ${name} (\\d+)$`, 'm'));
            assert.ok(match, `Missing checkpoint test summary: ${name}`);
            return Number(match[1]);
          };
          assert.ok(count('tests') >= 7);
          assert.equal(count('pass'), count('tests'));
          for (const name of ['fail', 'cancelled', 'skipped', 'todo']) assert.equal(count(name), 0);
          NODE
      - name: Verify disk-only legacy Shadow CEO multi-store capture
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap deployment/legacy-shadow-state-capture.test.cjs | tee "$RUNNER_TEMP/legacy-shadow-tests.tap"
          node - "$RUNNER_TEMP/legacy-shadow-tests.tap" <<'NODE'
          const assert = require('node:assert/strict');
          const output = require('node:fs').readFileSync(process.argv[2], 'utf8');
          const count = name => {
            const match = output.match(new RegExp(`^# ${name} (\\d+)$`, 'm'));
            assert.ok(match, `Missing Shadow capture test summary: ${name}`);
            return Number(match[1]);
          };
          assert.ok(count('tests') >= 7);
          assert.equal(count('pass'), count('tests'));
          for (const name of ['fail', 'cancelled', 'skipped', 'todo']) assert.equal(count(name), 0);
          NODE
      - name: Verify bounded canary configuration and child-process cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-reporter=tap \
            deployment/canary-launcher.test.cjs \
            deployment/canary-runtime-probe.test.cjs \
            deployment/redis-canary-launcher.test.cjs \
            | tee "$RUNNER_TEMP/canary-supervision-tests.tap"
          node --input-type=module - "$RUNNER_TEMP/canary-supervision-tests.tap" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const output = readFileSync(process.argv[2], 'utf8');
          const count = (name) => {
            const match = output.match(new RegExp(`^# ${name} (\\d+)$`, 'm'));
            assert.ok(match, `Missing supervision TAP summary: ${name}`);
            return Number(match[1]);
          };
          for (const name of [
            'an exited child with no remaining process group does not consume shutdown grace',
            'deadline terminates a real stubborn child and reports forced shutdown failure',
            'external TERM is forwarded and successful child shutdown remains distinguishable',
          ]) {
            assert.ok(output.split(/\r?\n/).some(line => /^ok \d+ - /.test(line) && line.endsWith(` - ${name}`)),
              `Missing mandatory POSIX supervision test: ${name}`);
          }
          assert.ok(count('tests') > 0, 'Supervision tests must execute');
          assert.equal(count('pass'), count('tests'), 'All supervision tests must pass');
          for (const kind of ['fail', 'cancelled', 'skipped', 'todo']) {
            assert.equal(count(kind), 0, `${kind} supervision tests are not permitted`);
          }
          NODE
      - name: Record tested revision and limits
        env:
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Product path CI scope'
            echo "Tested checkout: $(git rev-parse HEAD)"
            echo "Event revision: ${EVENT_SHA}"
            echo "PR head (when applicable): ${PR_HEAD_SHA:-not a pull request}"
            echo 'Canonical Vercel production root: empireai-web (Next.js).'
            echo 'Root vercel.json still describes the legacy Vite compatibility target.'
            echo 'Both targets are checked; this workflow does not deploy or promote either target.'
          } >> "$GITHUB_STEP_SUMMARY"

  pillow:
    name: Pillow — clean install, typecheck, build, offline test
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact event revision without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22 with npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: pillow/package-lock.json
      - name: Clean install Pillow dependencies
        run: npm ci --prefix pillow
      - name: Typecheck Pillow
        run: npm run typecheck --prefix pillow
      - name: Build Pillow
        run: npm run build --prefix pillow
      - name: Run reviewed in-process Pillow commerce and operations suites
        working-directory: pillow
        run: |
          node --import tsx --test \
            src/validation/tests/amazon-marketplace-integration.test.ts \
            src/validation/tests/cj-dropshipping-integration.test.ts \
            src/validation/tests/fulfilment-orchestrator.test.ts \
            src/validation/tests/financial-operations-certification.test.ts \
            src/validation/tests/real-world-operations-certification.test.ts

  backend:
    name: Backend — clean install, typecheck, build, offline tests
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
    steps:
      - name: Checkout exact event revision without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22 with npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            pillow/package-lock.json
            backend/package-lock.json
      - name: Clean install and build linked Pillow package
        run: |
          npm ci --prefix pillow
          npm run build --prefix pillow
      - name: Clean install backend dependencies
        run: npm ci --prefix backend
      - name: Verify backend development environment
        run: npm run verify:env --prefix backend
      - name: Typecheck backend
        run: npm run typecheck --prefix backend
      - name: Build backend
        run: |
          npm run build --prefix backend
          test -f backend/dist/runtime/native-store-capture-lock.cjs
      - name: Work8 bounded integrated exams with kernel network denial
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the complete discovered suite. Only these authenticated
          # in-process HTTP examinations require socket creation; outbound
          # connect/send syscalls remain denied by the existing launcher.
          denied=()
          listen_only=()
          for test_file in src/validation/tests/work8-*.test.ts src/validation/tests/work8-*.test.mjs src/validation/tests/work6-commerce-routes.test.ts ../scripts/work8/autonomous-locks.test.ts ../scripts/work8/shared-store-days.test.ts; do
            case "$test_file" in
              src/validation/tests/work8-inspector-inbox.test.ts|src/validation/tests/work8-joined-assurance.test.ts)
                listen_only+=("$test_file") ;;
              *) denied+=("$test_file") ;;
            esac
          done
          test "${#listen_only[@]}" -eq 2
          python3 ../scripts/work8/isolated-exec.py node --import tsx --test --test-concurrency=1 "${denied[@]}"
          python3 ../scripts/work8/isolated-exec.py --listen-only node --import tsx --test --test-concurrency=1 "${listen_only[@]}"
      - name: Verify isolated SQL.js and HTTP capture admission, save and readback
        working-directory: backend
        env:
          REDIS_OPTIONAL: 'true'
        run: node --import tsx --test src/validation/tests/quiesced-sqlite-save.test.ts src/validation/tests/shadow-ceo-quiesced-capture.test.ts src/validation/tests/coordinated-sqlite-capture.test.ts src/validation/tests/capture-http-admission.test.ts src/validation/tests/capture-brain-worker-drain.test.ts src/validation/tests/capture-shared-brain-queue.test.ts src/validation/tests/capture-pillow-boot-drain.test.ts src/validation/tests/capture-authority-json.test.ts src/validation/tests/native-store-capture.test.ts src/validation/tests/sqlite-persistence-boundary.test.ts
      - name: Verify Amazon sync evidence and sandbox go-live isolation
        working-directory: backend
        run: |
          node --import tsx --test --test-concurrency=1 \
            src/validation/tests/amazon-sync-evidence.test.ts \
            src/validation/tests/amazon-listings-import.test.ts \
            src/validation/tests/amazon-seller-inventory-import.test.ts \
            src/validation/tests/amazon-order-import.test.ts \
            src/validation/tests/amazon-order-process-restart.test.ts \
            src/validation/tests/amazon-order-route.test.ts \
            src/validation/tests/amazon-oauth-evidence.test.ts \
            src/validation/tests/reality-002b.test.ts
      - name: Verify exact-model paid LLM price and durable reservation without provider calls
        working-directory: backend
        run: node --import tsx --test src/validation/tests/llm-spend-reservation.test.ts
      - name: Verify CJ account-bound authentication and exact VID stock without provider calls
        working-directory: backend
        run: |
          node --import tsx --test \
            src/validation/tests/cj-auth.test.ts \
            src/validation/tests/cj-live-auth-proof.test.ts \
            src/validation/tests/cj-production-adapter-truth.test.ts \
            src/validation/tests/cj-variant-stock-boundary.test.ts \
            src/validation/tests/cj-point-reservation.test.ts \
            src/validation/tests/amazon-fee-estimate-boundary.test.ts \
            src/validation/tests/pillow-economics-money-boundary.test.ts \
            src/validation/tests/pillow-commerce-presale.test.ts
      - name: Run fast invariant gate
        working-directory: backend
        run: npm run gate:fast-invariant
      - name: Run ranking, correction and authority lock tests
        working-directory: backend
        run: |
          node --import tsx --test \
            src/validation/tests/comma-contribution-ranking.lock.test.ts \
            src/validation/tests/correction-supersession.lock.test.ts \
            src/validation/tests/authority-synthetic-isolation.lock.test.ts \
            src/validation/tests/exec-cap-authority-compact.lock.test.ts \
            src/validation/tests/w1-t1-decision-state-propagation.test.ts
      - name: Run chat, recovery and canonical-truth tests
        working-directory: backend
        run: |
          node --import tsx --test \
            src/validation/tests/shadow-ceo-chat-admission.test.ts \
            src/validation/tests/shadow-ceo-durability.test.ts \
            src/validation/tests/pillow-accepted-request-recovery.test.ts \
            src/validation/tests/canonical-executive-truth.test.ts \
            src/validation/tests/dc05421-response-contract.test.ts
      - name: Record reviewed offline scope
        shell: bash
        run: |
          echo 'This product slice runs reviewed in-process tests across backend and Pillow. No provider credentials are supplied, and no live Amazon, CJ, payment, fulfilment, deployment, or commerce operation is claimed.' >> "$GITHUB_STEP_SUMMARY"

  legacy-frontend:
    name: Legacy Vite compatibility — clean install, typecheck, build
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event revision without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22 with npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean install legacy frontend dependencies
        run: npm ci --prefix frontend
      - name: Typecheck legacy frontend
        run: npm run typecheck --prefix frontend
      - name: Build legacy frontend
        run: npm run build --prefix frontend
      - name: Record current test coverage gap
        shell: bash
        run: |
          echo 'Legacy frontend has no test files or npm test script on this revision; CI currently proves typecheck and production build only.' >> "$GITHUB_STEP_SUMMARY"

  empireai-web:
    name: Canonical Next.js web — clean install, typecheck, test, build
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact event revision without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22 with npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: empireai-web/package-lock.json
      - name: Clean install Next.js web dependencies
        run: npm ci --prefix empireai-web
      - name: Typecheck Next.js web
        run: npm run typecheck --prefix empireai-web
      - name: Test Next.js web
        run: npm test --prefix empireai-web
      - name: Build Next.js web
        run: npm run build --prefix empireai-web
      - name: Diagnose known lint debt without masking product checks
        id: lint_diagnostic
        continue-on-error: true
        run: npm run lint --prefix empireai-web
      - name: Record lint baseline debt
        if: ${{ always() }}
        shell: bash
        run: |
          echo 'Lint is diagnostic and non-gating in this first product-path slice. Baseline observed on origin/main: 164 errors and 11 warnings. This is unresolved debt, not a lint PASS.' >> "$GITHUB_STEP_SUMMARY"

  work8-frontend-review:
    name: Work8 exact frontend review candidate (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned review source without moving deployment branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 720764722e6178d4126dcf376383096e204ec5ba
          persist-credentials: false
      # Publish the approved evidence bundle before this source head. The branch
      # is only transport: blob, commit and complete tree are independently pinned.
      - name: Checkout retained frontend bundle without deployment credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work8/examination-evidence-20261011
          path: _work8_evidence
          persist-credentials: false
      - name: Verify and restore exact frontend review candidate
        shell: bash
        run: |
          bundle=_work8_evidence/docs/work8/resume-20261011/FRONTEND-AUTONOMY-CANDIDATE.bundle
          test "$(git hash-object "$bundle")" = f559557f06a1e493e52fe5fe7f9c3c04b7773cda
          git bundle verify "$bundle"
          git fetch "$bundle" HEAD
          git checkout --detach 7dff79a6b712972b08add445d19e30cb664f69e0
          test "$(git rev-parse HEAD)" = 7dff79a6b712972b08add445d19e30cb664f69e0
          test "$(git rev-parse HEAD^{tree})" = 03e55a6cea520a6cb1d1a752b51d3c9781290c65
          # Review the bounded mobile Finance correction without updating the
          # deployment-linked frontend branch. Retain the original source pin.
          correction=_work8_evidence/docs/work8/remediation-20261012/assurance-console/frontend-mobile-finance.bundle
          test "$(git hash-object "$correction")" = 7b81f4069aef77823770cd1d26338c32a0e88838
          git bundle verify "$correction"
          git fetch "$correction" HEAD
          git checkout --detach 960d6167206e5fc9994adfe89c63d4ce83dd1123
          test "$(git rev-parse HEAD)" = 960d6167206e5fc9994adfe89c63d4ce83dd1123
          test "$(git rev-parse HEAD^{tree})" = a956c4f2235ac48d745d8e51a170fe5909bb3427
          communication=_work8_evidence/docs/work8/interrupted-recovery-20261012/bundles/FRONTEND-COMMUNICATION.bundle
          test "$(git hash-object "$communication")" = a4a4609a6a2e324d62730cc530642f7532c2525e
          git bundle verify "$communication"
          git fetch "$communication" refs/heads/work8/communication-ui-20261012
          git checkout --detach 900eeafe05dc2e9e3c7bc0844f791bb7b1a8f40a
          test "$(git rev-parse HEAD)" = 900eeafe05dc2e9e3c7bc0844f791bb7b1a8f40a
          test "$(git rev-parse HEAD^{tree})" = 79d458316ebb7407aa9aad45a4bab3f6f26c4f91
          usage=_work8_evidence/docs/work8/revised-review-20261012/business-finance/cost-intelligence17/FRONTEND-900ee-to-5276.bundle
          test "$(git hash-object "$usage")" = 05a7bc977a276f6af1402fe026c444e9ad65f007
          git bundle verify "$usage"
          git fetch "$usage" refs/heads/work8/cost-usage-ui-20261012
          git checkout --detach 5276c8dc7b58cc8602c1801f8db676f896db29d7
          test "$(git rev-parse HEAD)" = 5276c8dc7b58cc8602c1801f8db676f896db29d7
          test "$(git rev-parse HEAD^{tree})" = 94fd9dde528fe900e635671d91ce2586650d09a3
          preview=_work8_evidence/docs/work8/resumed-execution-20261012/pillow-preview/frontend-858b1c99.bundle
          test "$(git hash-object "$preview")" = b5c40b1eb0a4bc97bf7e3cba347585f01b4c758c
          git bundle verify "$preview"
          git fetch "$preview" HEAD
          git checkout --detach 858b1c99c5acd3ada160f2fe9c1448eb8e6beb09
          test "$(git rev-parse HEAD)" = 858b1c99c5acd3ada160f2fe9c1448eb8e6beb09
          test "$(git rev-parse HEAD^{tree})" = c268a1083fcf9b6364f1b000e4aa3ee7337c5ec4
          portfolio=_work8_evidence/docs/work8/post-publication-20261012/portfolio18/frontend-858b-to-e7fd.bundle
          test "$(git hash-object "$portfolio")" = c1deb0b80b2219b5248dc4cf674050ffa1e98a57
          git bundle verify "$portfolio"
          git fetch "$portfolio" HEAD
          git checkout --detach e7fd599a447a4e1b273363d7f664507194cd2ba1
          test "$(git rev-parse HEAD)" = e7fd599a447a4e1b273363d7f664507194cd2ba1
          test "$(git rev-parse HEAD^{tree})" = f077bb0e7008663f64dac4e01c4e218e67e4222e
          inbox=_work8_evidence/docs/work8/publication-closure-20261012/owner-inbox-frontend.bundle
          test "$(git hash-object "$inbox")" = 46d9a524ccbb88270791742ffab7a1575cefb573
          git bundle verify "$inbox"
          git fetch "$inbox" HEAD
          git checkout --detach ad5ce5df5e3a8d65b06b75bfed5a5af2e6de53a4
          test "$(git rev-parse HEAD)" = ad5ce5df5e3a8d65b06b75bfed5a5af2e6de53a4
          test "$(git rev-parse HEAD^{tree})" = 31a817093307b986ed97c870bab0ce5b5ba81e84
          comparables=_work8_evidence/docs/work8/o9-console-20261013/frontend.bundle
          test "$(git hash-object "$comparables")" = 5a05b10f3dbbdb611d9a9f5ee70c6946cee69bef
          git bundle verify "$comparables"
          git fetch "$comparables" HEAD
          git checkout --detach c6b698c4a98073789b6d6729c642a0882ad43b3f
          test "$(git rev-parse HEAD)" = c6b698c4a98073789b6d6729c642a0882ad43b3f
          test "$(git rev-parse HEAD^{tree})" = c6234ccc85b1a7600ee21952f90010de44f125a4
          rm -rf -- _work8_evidence
      - name: Use pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
      - name: Clean install reviewed web
        run: npm ci --prefix empireai-web
      - name: Typecheck reviewed web
        run: npm run typecheck --prefix empireai-web
      - name: Test reviewed web and financial readbacks
        working-directory: empireai-web
        run: |
          npm test
          node --test tests/work8/financial-rehearsal.test.mjs
      - name: Build reviewed web without deployment
        run: npm run build --prefix empireai-web

  bounded-redis-image:
    name: Real Redis image expiry, AOF and signal proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use the pinned supervisor runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
      - name: Build actual Redis image and execute runtime-library checks
        run: docker build --pull --file deployment/redis-canary.Dockerfile --tag empireai-redis-expiry:ci .
      - name: Require actual image authentication, AOF recovery, signal and expiry proof
        shell: bash
        run: |
          set -euo pipefail
          node deployment/redis-canary-image.test.cjs empireai-redis-expiry:ci | tee "$RUNNER_TEMP/redis-expiry-image.json"
          node - "$RUNNER_TEMP/redis-expiry-image.json" <<'NODE'
          const assert = require('node:assert/strict');
          const result = JSON.parse(require('node:fs').readFileSync(process.argv[2], 'utf8'));
          assert.equal(result.passed, true);
          assert.equal(result.cleanupComplete, true);
          assert.equal(result.checks.length, 4);
          assert.ok(result.checks.every(c => c.passed === true));
          assert.equal(result.hostedProviderProof, false);
          NODE
      - name: Preserve image verification outcome in job summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo '## Isolated Redis image verification' >> "$GITHUB_STEP_SUMMARY"
          echo "Tested checkout: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/redis-expiry-image.json"; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/redis-expiry-image.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No image runtime receipt: build or prior step failed. No hosted proof inferred.' >> "$GITHUB_STEP_SUMMARY"
          fi

  commerce-browser:
    name: Phone browser to authenticated persisted commerce fixture
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event revision without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
      - name: Install isolated application and browser dependencies
        run: |
          npm ci --prefix pillow
          npm run build --prefix pillow
          npm ci --prefix backend
          npm ci --prefix empireai-web
          cd empireai-web
          npx playwright install --with-deps chromium
      - name: Verify real phone browser login BFF backend and disk transaction
        run: node empireai-web/scripts/verify-commerce-browser.mjs
      - name: Build exact integrated frontend for source-context examination
        if: ${{ !cancelled() }}
        run: npm run build --prefix empireai-web
      - name: Examine authenticated source-context delivery on mobile and desktop
        if: ${{ !cancelled() }}
        working-directory: empireai-web
        env:
          WORK8_A8_BACKEND_ROOT: ${{ github.workspace }}/backend
          WORK8_A8_OUT: ${{ github.workspace }}/work8-source-context-evidence
        run: node e2e/work8-source-context-native.mjs
      - name: Preserve scoped source-context examination evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work8-source-context-evidence
          path: work8-source-context-evidence
          retention-days: 14
      - name: Examine Work8 two-stage media approval without live effects
        if: ${{ !cancelled() }}
        run: node empireai-web/e2e/work8-media-native.mjs
      - name: Preserve browser receipt screenshot and bounded server logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commerce-browser-evidence
          path: commerce-browser-evidence
          retention-days: 14

  legacy-capture-proof:
    name: Exact old revision pending-RAM capture decision (isolated)
    needs: repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed proof without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout exact protected source into separate isolated directory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 21384342c401def948926904913840e63c18dff7
          path: isolated-old-revision
          persist-credentials: false
      - name: Use pinned proof runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
      - name: Install exact old locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix isolated-old-revision/backend
      - name: One bounded proof using unmodified old storage source
        shell: bash
        run: |
          env -i PATH="$PATH" NODE_ENV=test LOG_LEVEL=fatal EMPIREAI_ISOLATED_CAPTURE_PROOF=1 \
            node --import "$GITHUB_WORKSPACE/isolated-old-revision/backend/node_modules/tsx/dist/loader.mjs" \
            deployment/legacy-critical-save-proof.mjs "$GITHUB_WORKSPACE/isolated-old-revision" "$RUNNER_TEMP/legacy-capture-proof"
      - name: Preserve synthetic capture artifacts and decision
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-capture-proof
          path: ${{ runner.temp }}/legacy-capture-proof
          retention-days: 14

  product-path-result:
    name: Product path result (no deployment)
    if: ${{ always() }}
    needs:
      - repository-contract
      - pillow
      - backend
      - legacy-frontend
      - empireai-web
      - work8-frontend-review
      - bounded-redis-image
      - commerce-browser
      - legacy-capture-proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every product check to pass
        env:
          CONTRACT_RESULT: ${{ needs.repository-contract.result }}
          PILLOW_RESULT: ${{ needs.pillow.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          LEGACY_WEB_RESULT: ${{ needs.legacy-frontend.result }}
          WORK8_WEB_RESULT: ${{ needs.work8-frontend-review.result }}
          NEXT_WEB_RESULT: ${{ needs.empireai-web.result }}
          REDIS_IMAGE_RESULT: ${{ needs.bounded-redis-image.result }}
          LEGACY_CAPTURE_RESULT: ${{ needs.legacy-capture-proof.result }}
          COMMERCE_BROWSER_RESULT: ${{ needs.commerce-browser.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "repository-contract=${CONTRACT_RESULT}" \
            "pillow=${PILLOW_RESULT}" \
            "backend=${BACKEND_RESULT}" \
            "legacy-frontend=${LEGACY_WEB_RESULT}" \
            "empireai-web=${NEXT_WEB_RESULT}" \
            "bounded-redis-image=${REDIS_IMAGE_RESULT}"
          for result in \
            "$CONTRACT_RESULT" \
            "$PILLOW_RESULT" \
            "$BACKEND_RESULT" \
            "$LEGACY_WEB_RESULT" \
            "$NEXT_WEB_RESULT" \
            "$WORK8_WEB_RESULT" \
            "$REDIS_IMAGE_RESULT" \
            "$COMMERCE_BROWSER_RESULT" \
            "$LEGACY_CAPTURE_RESULT"; do
            test "$result" = success
          done
          echo 'All configured offline product gates passed, including the reviewed backend/Pillow suite. Live integrations, lint, deployment, and production certification remain outside this gate.' >> "$GITHUB_STEP_SUMMARY"
