# Reference settings for a temporary separate service; never apply to production.
# New Railway services may not support config-as-code. Apply these settings via
# the provider API/UI and verify the effective service config before attaching source.
# Configure disposable Redis/auth and absolute expiry before attaching source.
[build]
builder = "NIXPACKS"
buildCommand = "NPM_CONFIG_PRODUCTION=false npm ci --prefix pillow && NPM_CONFIG_PRODUCTION=false npm ci --prefix backend && node scripts/sync-pillow-governance.mjs && npm run build --prefix pillow && npm run build --prefix backend"

[deploy]
startCommand = "node deployment/canary-launcher.cjs"
restartPolicyType = "NEVER"
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
