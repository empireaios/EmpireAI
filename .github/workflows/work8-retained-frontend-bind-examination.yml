name: Work 8 retained image frontend listener examination
on:
  push:
    branches: [work8/rollback-package-20261029e]
permissions: {}
concurrency:
  group: work8-rollback-package-20261029e
  cancel-in-progress: false
jobs:
  package:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact reviewed controller without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Use pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Load retained immutable images and examine remaining policy contract
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROLLER: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: bash controller/scripts/work8/rollback-package/package-and-examine.sh
      - name: Preserve complete sanitized diagnostics even after interrupted execution
        if: always()
        run: |
          status=0
          python3 controller/scripts/work8/rollback-package/complete-diagnostics.py finalize || status=1
          exit "$status"
      - name: Retain remaining examination and complete sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work8-retained-policy-${{ github.run_id }}
          path: release-package-output/publishable/
          retention-days: 30
          if-no-files-found: error
