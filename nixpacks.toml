# Non-secret Railway runtime defaults (REAL-068).
# Secrets (REDIS_URL, API keys, SESSION_SECRET) must be set in Railway Variables.

[variables]
EMPIREAI_REPO_ROOT = "/app"
NODE_ENV = "production"
DATABASE_PATH = "/data/empireai-brain.db"

# Nixpacks selects a major only; preinstall rejects a different patch.
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = ["NPM_CONFIG_PRODUCTION=false npm ci"]
