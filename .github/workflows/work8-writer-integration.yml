name: Work 8 actual writer integration examination
on:
  push:
    branches: ['work8/writer-integration-20261025v']
permissions:
  contents: read
concurrency:
  group: work8-writer-integration-20261025v
  cancel-in-progress: false
jobs:
  writer-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout approved event source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      # Pillow/backend compilation accepted on c8b56b5e230c064982b9a8ed24ecf78f475137d3
      # in run40161831246. This reviewed successor changes only this workflow
      # and the synthetic Redis fixture/import/tests; application/build inputs
      # are unchanged. Restore the compile gate before future application changes.
      - name: Examine only the new writer integration boundary
        env:
          WORK8_EXPECTED_SOURCE: ${{ github.sha }}
        run: bash scripts/work8/run-writer-integration.sh
      - name: Retain exact-source evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work8-writer-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/work8-writer-evidence/
          if-no-files-found: error
          retention-days: 7
