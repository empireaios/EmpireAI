name: Work 8 V25 authorised retained-package final return
on: create
permissions:
  contents: read
  actions: read
concurrency:
  group: work8-native-transition-20261031
  cancel-in-progress: false
jobs:
  transition:
    if: github.event.ref_type == 'branch' && github.event.ref == 'work8/v25-20261031-return' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Exact reviewed controller, no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Read preserved immutable component pins
        id: pins
        run: |
          python3 - <<'PY'
          import json,os,re
          m=json.load(open('controller/scripts/work8/native-transition/components.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            for role in ['backend','normal','recovery']:
              assert re.fullmatch('[a-f0-9]{40}',m[role]['commit'])
              assert re.fullmatch('[a-f0-9]{40}',m[role]['tree'])
              print(role+'='+m[role]['commit'],file=out)
          PY
      - name: Verify backend source identity without rebuilding
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.backend }}
          path: backend-source
          persist-credentials: false
      - name: Verify NORMAL source identity and pinned browser lock
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.normal }}
          path: normal-source
          persist-credentials: false
      - name: Verify distinct RECOVERY source identity without rebuilding
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.recovery }}
          path: recovery-source
          persist-credentials: false
      - name: Preserve accepted Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Verify and load exact preserved images; extract locked browser driver without scripts
        env:
          GH_RETAINED_READ_TOKEN: ${{ github.token }}
        run: python3 controller/scripts/work8/native-transition/prepare-retained.py
      - name: Execute one coherent final-return transition with retained candidates
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'
          CANDIDATE_ARTIFACT_ID: '13037177457'
          CANDIDATE_ARTIFACT_DIGEST: '3fa3cf875e23cd4ff201c053f49915ba2007cfdf369ad2bbde6eadd629861d23'
        run: python3 controller/scripts/work8/native-transition/examine.py --examine-retained
      - name: Gate only new sanitized evidence and enforce retained-artifact bounds
        id: upload
        if: always()
        run: python3 controller/scripts/work8/native-transition/retained-upload-preflight.py
      - name: Preserve sanitized complete or failed examination evidence
        if: always() && steps.upload.outputs.allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work8-v25-native-evidence-${{ github.sha }}-${{ github.run_id }}
          path: native-transition-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
