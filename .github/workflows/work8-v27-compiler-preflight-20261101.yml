name: Work 8 V27 isolated compiler permission preflight
on: create
permissions:
  contents: read
  actions: read
concurrency:
  group: work8-v27-packaging-20261101
  cancel-in-progress: false
jobs:
  compiler-preflight:
    if: github.event.ref_type == 'branch' && github.event.ref == 'work8/v27-20261101-compiler-preflight' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact reviewed packaging controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Exact unchanged reviewed backend source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 94aa919c7c39c4c9bf2c14b636232da028dba72d
          path: backend-source
          fetch-depth: 2
          persist-credentials: false
      - name: Preserve accepted compiler host Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: One isolated permission preflight and exact generated outputs
        env:
          GH_RETAINED_READ_TOKEN: ${{ github.token }}
        run: python3 controller/scripts/work8/packaging/stage-a.py
      - name: Gate bounded sanitized Stage A evidence
        id: upload
        if: always()
        run: python3 controller/scripts/work8/packaging/stage-a-upload.py
      - name: Preserve Stage A outputs and exact first failure
        if: always() && steps.upload.outputs.allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work8-v27-stage-a-${{ github.sha }}-${{ github.run_id }}
          path: stage-a-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
