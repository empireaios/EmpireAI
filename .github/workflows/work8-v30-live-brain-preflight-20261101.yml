name: Work 8 V30 bounded actual live Brain preflight
on: create
permissions:
  contents: read
  actions: read
concurrency:
  group: work8-v30-live-brain-preflight-20261101
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event.ref_type == 'branch' && github.event.ref == 'work8/v30-20261101-live-brain-preflight' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact reviewed controller, no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Verify source, shared reservation and exact preflight authority
        run: python3 controller/scripts/work8/native-transition/verify-v30-gate.py --preflight
      - name: Read preserved immutable component pins
        id: pins
        run: |
          python3 - <<'PY'
          import json,os,re
          m=json.load(open('controller/scripts/work8/native-transition/components.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            for role in ['backend','normal','recovery']:
              assert re.fullmatch('[a-f0-9]{40}',m[role]['commit'])
              assert re.fullmatch('[a-f0-9]{40}',m[role]['tree'])
              print(role+'='+m[role]['commit'],file=out)
          PY
      - name: Checkout exact backend source for identity and readback only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.backend }}
          path: backend-source
          fetch-depth: 2
          persist-credentials: false
      - name: Preserve accepted Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Verify retained archive once and load backend only
        env:
          GH_RETAINED_READ_TOKEN: ${{ github.token }}
        run: python3 controller/scripts/work8/native-transition/prepare-base-candidates.py --preflight
      - name: Actual initialized Brain preflight only; no business transition
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'
        run: python3 controller/scripts/work8/native-transition/examine-v26.py --preflight-v30-live-brain
      - name: Gate only new sanitized evidence and enforce retained-artifact bounds
        id: upload
        if: always()
        run: python3 controller/scripts/work8/native-transition/retained-upload-preflight.py
      - name: Preserve sanitized complete or failed evidence
        if: always() && steps.upload.outputs.allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work8-v30-live-brain-preflight-evidence-${{ github.sha }}-${{ github.run_id }}
          path: native-transition-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
