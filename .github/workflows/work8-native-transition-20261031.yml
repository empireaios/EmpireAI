name: Work 8 missing distinct full-native version transition
on: create
permissions:
  contents: read
concurrency:
  group: work8-native-transition-20261031
  cancel-in-progress: false
jobs:
  transition:
    if: github.event.ref_type == 'branch' && github.event.ref == 'work8/closure-20261031-native-transition' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Exact reviewed controller, no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Read reviewed immutable component pins
        id: pins
        run: |
          python3 - <<'PY'
          import json,os,re
          m=json.load(open('controller/scripts/work8/native-transition/components.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            for role in ['backend','normal','recovery']:
              assert re.fullmatch('[a-f0-9]{40}',m[role]['commit'])
              assert re.fullmatch('[a-f0-9]{40}',m[role]['tree'])
              print(role+'='+m[role]['commit'],file=out)
          PY
      - name: Exact full-native backend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.backend }}
          path: backend-source
          persist-credentials: false
      - name: Exact full-native normal frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.normal }}
          path: normal-source
          persist-credentials: false
      - name: Exact distinct recovery frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.recovery }}
          path: recovery-source
          persist-credentials: false
      - name: Preserve accepted Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Execute only the missing full-native version transition
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          CI: 'true'
        run: python3 controller/scripts/work8/native-transition/examine.py
      - name: Independently enforce bounded and scanned upload set
        id: upload
        if: always()
        run: python3 controller/scripts/work8/native-transition/upload-preflight.py
      - name: Retain exact images and sanitized evidence
        if: always() && steps.upload.outputs.allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work8-native-transition-${{ github.sha }}-${{ github.run_id }}
          path: native-transition-output/
          if-no-files-found: error
          retention-days: 7
